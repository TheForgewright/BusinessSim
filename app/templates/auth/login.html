{% extends "base.html" %}

{% block title %}Login - Business Simulation Game{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3>Login</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="login_identifier" class="form-label">Email or Username</label>
                        <input type="text" class="form-control" id="login_identifier" name="login_identifier" required autofocus>
                        <small class="form-text text-muted">Enter your email address or username</small>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <hr>

                <div class="text-center">
                    <p class="mb-2">
                        <a href="{{ url_for('auth.request_reset') }}">Forgot your password?</a>
                    </p>
                    <p class="mb-0">
                        Professor? <a href="{{ url_for('auth.register') }}">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
